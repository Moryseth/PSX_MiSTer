name: Build PSX Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PSX core with Quartus 17
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            raetro/quartus:17.0 \
            quartus_sh --flow compile PSX.qpf

      - name: Upload RBF
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Crop-Test
          path: output_files/*.rbf
