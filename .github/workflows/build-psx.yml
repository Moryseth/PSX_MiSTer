name: Build PSX Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: raetro/quartus:17.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PSX core
        run: quartus_sh --flow compile PSX.qpf

      - name: Upload RBF
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Crop-Test
          path: output_files/*.rbf
